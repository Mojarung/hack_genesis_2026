openapi: 3.0.3
info:
  title: Acme Pay
  version: "1.4.0"
  description: |
    Демо-спецификация платёжного провайдера для проверки генератора.
    Содержит типовые для платежей вещи: bearer-auth, $ref на схемы,
    path/query-параметры, идемпотентный POST, вложенный ресурс.
servers:
  - url: https://api.{env}.acmepay.com/v1
    variables:
      env:
        default: sandbox
        enum: [sandbox, live]
security:
  - bearerAuth: []
tags:
  - name: payments
    description: Создание и жизненный цикл платежей
  - name: refunds
    description: Возвраты по проведённым платежам
paths:
  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: Список платежей
      parameters:
        - name: status
          in: query
          description: Фильтр по статусу
          schema:
            type: string
            enum: [pending, authorized, captured, failed]
        - name: limit
          in: query
          description: Размер страницы
          schema:
            type: integer
            default: 25
        - name: cursor
          in: query
          description: Курсор пагинации
          schema:
            type: string
      responses:
        "200":
          description: Страница платежей
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Создать платёж
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
      responses:
        "201":
          description: Платёж создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "422":
          description: Ошибка валидации
  /payments/{payment_id}:
    parameters:
      - name: payment_id
        in: path
        required: true
        description: Идентификатор платежа
        schema:
          type: string
    get:
      operationId: getPayment
      tags: [payments]
      summary: Получить платёж
      responses:
        "200":
          description: Платёж
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          description: Не найден
  /payments/{payment_id}/capture:
    post:
      operationId: capturePayment
      tags: [payments]
      summary: Списать заблокированную сумму
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  $ref: "#/components/schemas/Amount"
      responses:
        "200":
          description: Списано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /refunds:
    post:
      operationId: createRefund
      tags: [refunds]
      summary: Создать возврат
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequest"
      responses:
        "201":
          description: Возврат создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Секретный ключ провайдера
  schemas:
    Amount:
      type: object
      required: [value, currency]
      properties:
        value:
          type: integer
          description: Сумма в минорных единицах
          example: 149900
        currency:
          type: string
          description: Код валюты ISO-4217
          example: RUB
    PaymentRequest:
      type: object
      required: [amount, payment_method]
      properties:
        amount:
          $ref: "#/components/schemas/Amount"
        payment_method:
          type: string
          description: Способ оплаты
          enum: [card, sbp, wallet]
        capture:
          type: boolean
          description: Списывать сразу или только авторизовать
        description:
          type: string
          description: Назначение платежа
        metadata:
          type: object
          description: Произвольные данные мерчанта
    Payment:
      type: object
      required: [id, status, amount]
      properties:
        id:
          type: string
          description: Идентификатор платежа
        status:
          type: string
          enum: [pending, authorized, captured, failed]
        amount:
          $ref: "#/components/schemas/Amount"
        created_at:
          type: string
          format: date-time
        refunds:
          type: array
          description: Возвраты по платежу
          items:
            $ref: "#/components/schemas/Refund"
    PaymentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        next_cursor:
          type: string
    RefundRequest:
      type: object
      required: [payment_id, amount]
      properties:
        payment_id:
          type: string
        amount:
          $ref: "#/components/schemas/Amount"
        reason:
          type: string
    Refund:
      type: object
      required: [id, payment_id, status]
      properties:
        id:
          type: string
        payment_id:
          type: string
        status:
          type: string
          enum: [pending, succeeded, failed]
        payment:
          $ref: "#/components/schemas/Payment"
