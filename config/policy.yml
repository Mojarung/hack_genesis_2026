# Политика маршрутизации по умолчанию: «balanced».
# Всё, что здесь задано, меняется без правки кода. Другие пресеты — в config/policies/.

name: balanced
description: >
  Держим целевые доли трафика и объёма, но учитываем конверсию (в том числе по банку из истории),
  текущую загрузку, позицию в каскаде и диапазон суммы. Fallback — self-provider spacepayments.

fallback_provider: spacepayments

# Hard-constraints — условия допуска. Проверяются в этом порядке; любое нарушение исключает провайдера.
# К fallback-провайдеру применяются только статические правила из этого списка (provider_active, currency,
# amount_range, margin, bank_filter): реквизиты, in-progress, интенсивность и предохранитель self-provider
# не ограничивают — иначе при плотной очереди заявка останется вообще без маршрута.
# Явный список — fallback_constraints: [...]; пустой список — fallback безусловный.
hard_constraints:
  - provider_active        # status == active
  - currency             # валюта заявки совпадает с валютой провайдера/шлюза (RUB_SBP_WITHDRAW → RUB)
  - traffic_enabled        # traffic_percentage > 0 (0 = выведен из ротации)
  - amount_range           # limit_amount_min <= amount <= limit_amount_max
  - daily_limit            # daily_approved_amount + amount <= daily_amount_limit
  - in_progress_count      # in_progress_count + 1 <= in_progress_count_limit
  - in_progress_amount     # in_progress_amount + amount <= in_progress_amount_limit
  - requisites             # available_requisites > 0
  - margin                 # provider_margin_pct <= merchant_margin_pct (или allow_negative_agreement)
  - bank_filter            # banks / exclude_banks
  - rate_limit             # requests_per_minute_limit за скользящую минуту
  - daily_turnover_max     # фин. обязательство «не более X ₽/сутки»
  - circuit_breaker        # провайдер в карантине после серии отказов (см. circuit_breaker ниже)

# Способ выбора среди допустимых: weighted — все цели сразу с весами (chain — цепочка, см. policies/strategy_chain.yml).
# normalization: pool — оценка каждой цели приводится к разбросу среди кандидатов заявки (лучший 1, худший 0,
# все равны — 0.5), и вес означает важность цели; absolute — оценки стратегий как есть (0..1).
selection:
  mode: weighted
  normalization: pool

# Soft-goals и их веса. Скор кандидата = Σ(вес × оценка по пулу) / Σ весов. Вес 0 — цель выключена.
goals:
  traffic_share: 0.30      # стратегия 1: доля по числу заявок (traffic_percentage)
  volume_share: 0.10       # стратегия 2: доля по объёму (volume_share_pct)
  cascade_priority: 0.10   # стратегия 3: очередь в каскаде (priority)
  amount_band: 0.10        # стратегия 4: предпочтения по диапазону суммы (amount_bands ниже)
  conversion: 0.10         # стратегия 5: conversion_24h
  bank_affinity: 0.05      # конверсия пары провайдер × банк по истории (сглаженная)
  load: 0.15               # загрузка лимитов (дневной оборот, in-progress)
  turnover_min: 0.05       # стратегия 7: фин. обязательство «не менее X ₽/сутки»
  rate_headroom: 0.05      # стратегия 6: запас по интенсивности
  latency: 0.00            # скорость ответа (выключено)
  margin: 0.00             # стоимость для мерчанта (выключено)
  expected_value: 0.00     # ожидаемая маржа = конверсия × маржа (выключено, см. policies/profit_first.yml)

# При равном скоре: кто раньше в списке — тот важнее.
tie_breakers: [priority, conversion, name]

# Стратегия 4: какой провайдер предпочтителен в диапазоне суммы (null — без границы).
# ramp: N — плавный переход шириной N ₽ у границ: на самой границе оценка нейтральна (0.5),
# чтобы 49 999 ₽ и 50 001 ₽ не получали противоположные оценки. Без ramp граница резкая.
amount_bands:
  - { min: 500,    max: 50000,  prefer: [payflow] }
  - { min: 50001,  max: 100000, prefer: [vipay] }
  - { min: 100001, max: null,   prefer: [quickpay] }

# Параметры, которых нет в providers.json (и переопределения любых его полей).
providers:
  vipay:
    volume_share_pct: 50
    requests_per_minute_limit: 15
    daily_turnover_max: 5000000
  payflow:
    volume_share_pct: 30
    requests_per_minute_limit: 7
    daily_turnover_min: 2000000
  quickpay:
    volume_share_pct: 20
    requests_per_minute_limit: 15

# Предохранитель: после failures отказов/таймаутов подряд провайдер выбывает на cooldown_sec.
circuit_breaker:
  failures: 3
  cooldown_sec: 300

# Исход отправки: optimistic — все одобрены (детерминированно, режим сдачи);
# conversion — по conversion_24h с seed (демонстрация каскада при отказах).
simulation:
  mode: optimistic
  seed: 42
  # Что делать с таймаутом (истёкшей попыткой):
  #   cascade — как написано в ТЗ: таймаут = отказ, провайдер выбывает из пула, идём к следующему;
  #   hold    — как разъяснили эксперты на QA 04.09: статуса нет, значит заявка могла уйти —
  #             повторно её никуда не отправляем и ёмкости провайдера не освобождаем.
  # Сдаём cascade (буква ТЗ); hold показываем как более безопасную для денег модель.
  timeout: cascade
