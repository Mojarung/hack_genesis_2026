# Классический каскад «как депозиты в production»: строго по priority,
# при отказе — следующий. Остальные цели выключены.

name: cascade
description: Последовательный обход провайдеров по priority; отказ — переход к следующему.

fallback_provider: spacepayments

hard_constraints:
  - provider_active
  - currency             # валюта заявки совпадает с валютой провайдера/шлюза (RUB_SBP_WITHDRAW → RUB)
  - traffic_enabled
  - amount_range
  - bank_filter
  - daily_limit
  - in_progress_count
  - in_progress_amount
  - requisites
  - margin
  - rate_limit
  - daily_turnover_max
  - circuit_breaker

goals:
  cascade_priority: 1.0

tie_breakers: [priority, name]

providers:
  vipay:    { requests_per_minute_limit: 15 }
  payflow:  { requests_per_minute_limit: 7 }
  quickpay: { requests_per_minute_limit: 15 }

circuit_breaker:
  failures: 3
  cooldown_sec: 300

simulation:
  mode: conversion
  seed: 7
