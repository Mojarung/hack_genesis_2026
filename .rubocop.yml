plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    - "out/**/*"
    - "coverage/**/*"
    - "scripts/validate_10.rb"   # скрипт организаторов — оставляем как есть

Style/Documentation:
  Enabled: false
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Репозиторий держим в LF, даже когда работаем из Windows.
Layout/EndOfLine:
  EnforcedStyle: lf
Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 20
Metrics/AbcSize:
  Max: 25
Metrics/ClassLength:
  Max: 180
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "Rakefile"
Metrics/ParameterLists:
  CountKeywordArgs: false

Naming/MethodParameterName:
  AllowedNames: [op, id, at, to, by, rng]

RSpec/ExampleLength:
  Max: 15
RSpec/MultipleExpectations:
  Max: 5
RSpec/NestedGroups:
  Max: 4
RSpec/MultipleMemoizedHelpers:
  Max: 8
