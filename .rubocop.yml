plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    - "out/**/*"
    - "coverage/**/*"
    - "scripts/validate_10.rb"   # скрипт организаторов — оставляем как есть
    - "СТАРТ ХАКАТОНА*/**/*"     # исходная выгрузка организаторов рядом с репозиторием

Style/Documentation:
  Enabled: false
# `class X < Data.define(...)` вместо блока: внутри нужны константы и вложенные классы,
# а лишний анонимный предок в цепочке наследования ничего не стоит.
Style/DataInheritance:
  Enabled: false
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Репозиторий держим в LF, даже когда работаем из Windows.
Layout/EndOfLine:
  EnforcedStyle: lf
Layout/LineLength:
  Max: 120

Style/FormatStringToken:
  EnforcedStyle: unannotated

# Правила рекомендаций и сериализация собирают длинные сообщения из многих полей:
# по ABC это «сложно», по факту — линейный список интерполяций.
Metrics/MethodLength:
  Max: 20
Metrics/AbcSize:
  Max: 32
Metrics/CyclomaticComplexity:
  Max: 9
Metrics/PerceivedComplexity:
  Max: 10
Metrics/ClassLength:
  Max: 180
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "Rakefile"
Metrics/ParameterLists:
  CountKeywordArgs: false

Naming/MethodParameterName:
  AllowedNames: [op, id, at, to, by, rng]

# Часть спеков описывает подсистему (загрузчики, аналитика, интеграция), а не один класс.
RSpec/DescribeClass:
  Enabled: false
RSpec/ExampleLength:
  Max: 15
RSpec/MultipleExpectations:
  Max: 5
RSpec/NestedGroups:
  Max: 4
RSpec/MultipleMemoizedHelpers:
  Max: 8
